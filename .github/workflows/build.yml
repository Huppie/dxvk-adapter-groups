name: build

on:
  workflow_dispatch:
    inputs:
      dxvk_ref:
        description: Upstream DXVK tag, branch or commit SHA (empty = latest release)
        required: false
        default: ''
  push:
    branches: [main]
    paths:
      - 'patches/**'
      - 'dist/**'
      - '.github/workflows/*.yml'
  # schedule: [{cron: '17 4 * * 1'}]  (paused until a DXVK release the patches apply to)

permissions:
  contents: write
  issues: write

concurrency:
  group: build
  cancel-in-progress: false

jobs:
  targets:
    runs-on: ubuntu-latest
    outputs:
      refs: ${{ steps.t.outputs.refs }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: t
        env:
          INPUT_REF: ${{ inputs.dxvk_ref }}
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # On push, build each patch set the push changed (all of them if none or unknown);
          # patches/master builds DXVK master, patches/<ref> builds <ref>.
          if [[ "$GITHUB_EVENT_NAME" == push ]]; then
            all=$(find patches -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort)
            changed=""
            if git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
              changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- patches |
                cut -d/ -f2 | sort -u | grep -Fxf <(echo "$all") || true)
            fi
            refs=$(jq -cRn '[inputs | select(length > 0)]' <<<"${changed:-$all}")
          else
            refs=$(jq -cn --arg r "$INPUT_REF" '[$r]')
          fi
          echo "refs=$refs"
          echo "refs=$refs" >> "$GITHUB_OUTPUT"

  build:
    needs: targets
    strategy:
      fail-fast: false
      matrix:
        ref: ${{ fromJSON(needs.targets.outputs.refs) }}
    uses: ./.github/workflows/build-ref.yml
    with:
      dxvk_ref: ${{ matrix.ref }}

  report-failure:
    needs: [targets, build]
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
          TITLE: Scheduled build failed for DXVK's latest release
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          existing=$(gh issue list -R "$GITHUB_REPOSITORY" --state open --search "in:title \"$TITLE\"" --json title \
            -q "map(select(.title == \"$TITLE\")) | length")
          if [ "$existing" = 0 ]; then
            gh issue create -R "$GITHUB_REPOSITORY" --title "$TITLE" \
              --body "The patches did not apply or the build failed: $RUN"
          fi
