name: build-ref

on:
  workflow_call:
    inputs:
      dxvk_ref:
        description: Upstream DXVK tag, branch or commit SHA (empty = latest release)
        type: string
        default: ''

env:
  UPSTREAM: doitsujin/dxvk

jobs:
  resolve:
    runs-on: ubuntu-latest
    outputs:
      sha: ${{ steps.r.outputs.sha }}
      ref: ${{ steps.r.outputs.ref }}
      version: ${{ steps.r.outputs.version }}
      tag: ${{ steps.r.outputs.tag }}
      patchset: ${{ steps.r.outputs.patchset }}
      patchdir: ${{ steps.r.outputs.patchdir }}
      skip: ${{ steps.r.outputs.skip }}
      latest: ${{ steps.r.outputs.latest }}
    steps:
      - uses: actions/checkout@v4
      - id: r
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_REF: ${{ inputs.dxvk_ref }}
        run: |
          set -euo pipefail
          ref="${INPUT_REF:-$(gh release view -R "$UPSTREAM" --json tagName -q .tagName)}"
          url="https://github.com/$UPSTREAM"

          if git ls-remote --exit-code "$url" "refs/tags/$ref" >/dev/null; then
            sha=$(gh api "repos/$UPSTREAM/commits/$ref" -q .sha)
            version="${ref#v}"; base="$ref"; latest=true
          elif [[ "$ref" =~ ^[0-9a-f]{7,40}$ ]]; then
            sha=$(gh api "repos/$UPSTREAM/commits/$ref" -q .sha)
            status=$(gh api "repos/$UPSTREAM/compare/master...$sha" -q .status)
            [[ "$status" =~ ^(behind|identical)$ ]] && branch=master || branch=git
            version="$branch-${sha:0:8}"; base="$version"; latest=false
          elif branch_sha=$(git ls-remote --exit-code "$url" "refs/heads/$ref" | cut -f1); then
            sha="$branch_sha"; version="$ref-${sha:0:8}"; base="$version"; latest=false
          else
            echo "::error::Unknown DXVK ref: $ref"; exit 1
          fi

          patchdir="patches/$ref"
          [[ -d "$patchdir" ]] || patchdir=patches/master
          patchset=$({ echo "$patchdir"; cat "$patchdir"/*.patch; } | sha256sum | cut -c1-12)
          releases=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            -q ".[] | select(.tag_name | startswith(\"$base-adaptergroups.\")) | [.tag_name, .body] | @json")
          n=$(jq -rs '[.[] | .[0] | sub(".*\\."; "") | tonumber] | max // 0' <<<"$releases")
          skip=false
          if [[ "$GITHUB_EVENT_NAME" != workflow_dispatch ]] &&
             jq -es --arg p "Patch set: \`$patchset\`" 'any(.[] | .[1]; contains($p))' <<<"$releases" >/dev/null; then
            skip=true
          fi

          tag="$base-adaptergroups.$((n + 1))"
          echo "ref=$ref sha=$sha version=$version tag=$tag patchdir=$patchdir patchset=$patchset skip=$skip latest=$latest"
          { echo "ref=$ref"; echo "sha=$sha"; echo "version=$version"; echo "tag=$tag"
            echo "patchdir=$patchdir"; echo "patchset=$patchset"; echo "skip=$skip"; echo "latest=$latest"; } >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    if: needs.resolve.outputs.skip != 'true'
    runs-on: ubuntu-latest
    container: debian:13.1
    env:
      PKG: dxvk-${{ needs.resolve.outputs.version }}-adaptergroups
      PATCHDIR: ${{ needs.resolve.outputs.patchdir }}
    steps:
      - name: Install toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            g++-mingw-w64-i686-posix gcc-mingw-w64-i686-posix binutils-mingw-w64-i686 \
            meson ninja-build glslang-tools git ca-certificates zip
          update-alternatives --set i686-w64-mingw32-gcc /usr/bin/i686-w64-mingw32-gcc-posix
          update-alternatives --set i686-w64-mingw32-g++ /usr/bin/i686-w64-mingw32-g++-posix

      - uses: actions/checkout@v4
        with:
          path: repo

      - name: Fetch DXVK and apply patches
        run: |
          git clone --filter=blob:none "https://github.com/$UPSTREAM.git" dxvk
          cd dxvk
          git checkout --detach "${{ needs.resolve.outputs.sha }}"
          git submodule update --init --recursive --depth 1
          git -c user.name="dxvk-supcom-fix CI" -c user.email="ci@invalid" \
            am "$GITHUB_WORKSPACE/repo/$PATCHDIR"/*.patch

      - name: Build
        working-directory: dxvk
        run: |
          meson setup --cross-file build-win32.txt --buildtype release \
            --prefix "$GITHUB_WORKSPACE/out/$PKG" --strip --bindir x32 --libdir x32 \
            -Db_ndebug=if-release build.w32
          ninja -C build.w32 install

      - name: Package
        run: |
          out="$GITHUB_WORKSPACE/out"
          find "$out/$PKG/x32" -type f ! -name '*.dll' -delete
          mkdir "$out/$PKG/patches"
          cp "repo/$PATCHDIR"/*.patch "$out/$PKG/patches/"
          cp repo/dist/instructions.txt "$out/$PKG/"
          cp dxvk/LICENSE "$out/$PKG/DXVK-LICENSE"
          cd "$out"
          tar -czf "$PKG.tar.gz" "$PKG"
          zip -qr "$PKG.zip" "$PKG"
          cp "$PKG/x32/d3d9.dll" d3d9.dll
          sha256sum d3d9.dll "$PKG.tar.gz" "$PKG.zip" > SHA256SUMS
          cat SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: |
            out/*.tar.gz
            out/*.zip
            out/d3d9.dll
            out/SHA256SUMS

  release:
    needs: [resolve, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ needs.resolve.outputs.tag }}
          path: out
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
          REF: ${{ needs.resolve.outputs.ref }}
          SHA: ${{ needs.resolve.outputs.sha }}
          PATCHSET: ${{ needs.resolve.outputs.patchset }}
          PATCHDIR: ${{ needs.resolve.outputs.patchdir }}
          LATEST: ${{ needs.resolve.outputs.latest }}
        run: |
          {
            echo "Unofficial DXVK build: upstream \`$REF\` (doitsujin/dxvk@$SHA) plus the patches listed below."
            echo "Not affiliated with DXVK or FAF. Report problems in this repository."
            echo
            echo "Patches ([\`$PATCHDIR\`](https://github.com/$GITHUB_REPOSITORY/tree/$GITHUB_SHA/$PATCHDIR)):"
            awk 'FNR==1{if(t!="") print t; t=""; done=0} t!=""{if(/^ /){t=t $0; next} print t; t=""} !done && /^Subject: /{t=$0; sub(/^Subject: \[PATCH[^]]*\] /, "- ", t); done=1} END{if(t!="") print t}' "$PATCHDIR"/*.patch
            echo
            echo "Install: replace your 32-bit \`d3d9.dll\` with the one attached; see the [README](https://github.com/$GITHUB_REPOSITORY#readme)."
            echo
            echo "Patch set: \`$PATCHSET\`"
          } > notes.md
          gh release create "$TAG" out/* --title "$TAG" --notes-file notes.md --target "$GITHUB_SHA" --latest="$LATEST"

